<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient Bleed -->
    <radialGradient id="maskableSlate" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>

    <!-- Teal Gradient -->
    <linearGradient id="maskableTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <!-- Amber Glow -->
    <linearGradient id="maskableAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
  </defs>

  <!-- Full Bleed 512x512 Background (Prevents any white borders on Android squircle / circle masks) -->
  <rect width="512" height="512" fill="url(#maskableSlate)" />

  <!-- Ambient Glow within safe zone -->
  <circle cx="256" cy="256" r="160" fill="#14b8a6" opacity="0.1" />

  <!-- Centered Icon Mark scaled to fit strictly within 410px safe zone circle -->
  <!-- Target scale is ~1.7x of 200px (approx 340px, well within 410px safe circle) -->
  <g transform="translate(256, 256) scale(1.6) translate(-100, -100)">
    <!-- Symmetrical Palm Fronds (Left Wing) -->
    <g id="palm-left-maskable" fill="url(#maskableTeal)">
      <path d="M 92 135 C 75 142 52 138 42 125 C 50 120 70 120 88 128 Z" opacity="0.9"/>
      <path d="M 90 120 C 68 122 45 110 38 92 C 50 90 70 98 88 112 Z" opacity="0.95"/>
      <path d="M 92 104 C 68 100 48 80 46 60 C 58 64 76 76 89 96 Z" />
      <path d="M 95 88 C 76 76 62 52 64 36 C 76 45 88 64 96 80 Z" />
    </g>

    <!-- Symmetrical Palm Fronds (Right Wing) -->
    <g id="palm-right-maskable" fill="url(#maskableTeal)">
      <path d="M 108 135 C 125 142 148 138 158 125 C 150 120 130 120 112 128 Z" opacity="0.9"/>
      <path d="M 110 120 C 132 122 155 110 162 92 C 150 90 130 98 112 112 Z" opacity="0.95"/>
      <path d="M 108 104 C 132 100 152 80 154 60 C 142 64 124 76 111 96 Z" />
      <path d="M 105 88 C 124 76 138 52 136 36 C 124 45 112 64 104 80 Z" />
    </g>

    <!-- Central Stem -->
    <path d="M 98 140 C 98 154 100 165 100 168 C 100 165 102 154 102 140 Z" fill="#2dd4bf" opacity="0.8"/>

    <!-- Capsule Pill Upper Cap -->
    <path d="M 87 88 L 87 64 C 87 56.8 92.8 51 100 51 C 107.2 51 113 56.8 113 64 L 113 88 Z" fill="url(#maskableTeal)" />

    <!-- Capsule Pill Lower Body -->
    <path d="M 87 90 L 87 114 C 87 121.2 92.8 127 100 127 C 107.2 127 113 121.2 113 114 L 113 90 Z" fill="#0f172a" stroke="#2dd4bf" stroke-width="2.5" />
    <line x1="87" y1="89" x2="113" y2="89" stroke="#facc15" stroke-width="2" />

    <!-- Clinical Cross -->
    <rect x="96" y="74" width="8" height="24" rx="2" fill="#0f172a" stroke="#0f172a" stroke-width="3" />
    <rect x="88" y="82" width="24" height="8" rx="2" fill="#0f172a" stroke="#0f172a" stroke-width="3" />
    <rect x="96.5" y="74.5" width="7" height="23" rx="1.5" fill="url(#maskableAmber)" />
    <rect x="88.5" y="82.5" width="23" height="7" rx="1.5" fill="url(#maskableAmber)" />

    <!-- Sheen -->
    <path d="M 91 58 C 91 54 94 53 97 53 C 94 55 93 60 93 72 L 91 72 Z" fill="#ffffff" opacity="0.5" />
  </g>
</svg>
