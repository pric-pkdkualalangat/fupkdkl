<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="100%" height="100%">
  <defs>
    <linearGradient id="brandTealH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="amberH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <radialGradient id="slateGradH" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
  </defs>

  <!-- Left Icon Mark (80x80 box centered at 55, 60) -->
  <g transform="translate(15, 20) scale(0.4)">
    <rect width="200" height="200" rx="44" fill="url(#slateGradH)" stroke="#334155" stroke-width="2" />
    
    <!-- Symmetrical Palm Fronds (Left) -->
    <g fill="#14b8a6">
      <path d="M 92 135 C 75 142 52 138 42 125 C 50 120 70 120 88 128 Z" opacity="0.9"/>
      <path d="M 90 120 C 68 122 45 110 38 92 C 50 90 70 98 88 112 Z" opacity="0.95"/>
      <path d="M 92 104 C 68 100 48 80 46 60 C 58 64 76 76 89 96 Z" />
      <path d="M 95 88 C 76 76 62 52 64 36 C 76 45 88 64 96 80 Z" />
    </g>

    <!-- Symmetrical Palm Fronds (Right) -->
    <g fill="#14b8a6">
      <path d="M 108 135 C 125 142 148 138 158 125 C 150 120 130 120 112 128 Z" opacity="0.9"/>
      <path d="M 110 120 C 132 122 155 110 162 92 C 150 90 130 98 112 112 Z" opacity="0.95"/>
      <path d="M 108 104 C 132 100 152 80 154 60 C 142 64 124 76 111 96 Z" />
      <path d="M 105 88 C 124 76 138 52 136 36 C 124 45 112 64 104 80 Z" />
    </g>

    <!-- Center Pill -->
    <path d="M 87 88 L 87 64 C 87 56.8 92.8 51 100 51 C 107.2 51 113 56.8 113 64 L 113 88 Z" fill="url(#brandTealH)" />
    <path d="M 87 90 L 87 114 C 87 121.2 92.8 127 100 127 C 107.2 127 113 121.2 113 114 L 113 90 Z" fill="#0f172a" stroke="#2dd4bf" stroke-width="2.5" />
    <line x1="87" y1="89" x2="113" y2="89" stroke="#facc15" stroke-width="2" />

    <!-- Medical Cross -->
    <rect x="96" y="74" width="8" height="24" rx="2" fill="#0f172a" />
    <rect x="88" y="82" width="24" height="8" rx="2" fill="#0f172a" />
    <rect x="96.5" y="74.5" width="7" height="23" rx="1.5" fill="url(#amberH)" />
    <rect x="88.5" y="82.5" width="23" height="7" rx="1.5" fill="url(#amberH)" />
  </g>

  <!-- Typography Block -->
  <text x="115" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" fill="#f8fafc" letter-spacing="-1">
    Palme<tspan fill="#14b8a6">dex</tspan>
  </text>

  <!-- Tagline -->
  <text x="116" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" letter-spacing="0.5">
    CLINICAL MEDICATION REFERENCE TOOL
  </text>

  <!-- Offline-First Badge -->
  <g transform="translate(375, 40)">
    <rect width="90" height="22" rx="11" fill="#042f2e" stroke="#0d9488" stroke-width="1" />
    <circle cx="12" cy="11" r="3.5" fill="#2dd4bf" />
    <text x="22" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="9" font-weight="700" fill="#2dd4bf" letter-spacing="0.4">OFFLINE</text>
  </g>
</svg>
