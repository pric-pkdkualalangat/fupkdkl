<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="slateGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    
    <!-- Clinical Vibrant Teal Gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <!-- Secondary Teal Gradient for leaves -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="60%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#5eead4" />
    </linearGradient>

    <!-- Amber Accent Glow -->
    <linearGradient id="amberAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Badge Background -->
  <rect width="200" height="200" rx="44" fill="url(#slateGlow)" />
  <rect width="198" height="198" x="1" y="1" rx="43" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Subtle Ambient Glow Circle -->
  <circle cx="100" cy="100" r="70" fill="#14b8a6" opacity="0.08" filter="url(#softGlow)" />

  <!-- Symmetrical Palm Fronds (Left Wing) -->
  <g id="palm-left" fill="url(#leafGrad)">
    <!-- Bottom leaflet -->
    <path d="M 92 135 C 75 142 52 138 42 125 C 50 120 70 120 88 128 Z" opacity="0.9"/>
    <!-- Middle-low leaflet -->
    <path d="M 90 120 C 68 122 45 110 38 92 C 50 90 70 98 88 112 Z" opacity="0.95"/>
    <!-- Middle-high leaflet -->
    <path d="M 92 104 C 68 100 48 80 46 60 C 58 64 76 76 89 96 Z" />
    <!-- Top-high leaflet -->
    <path d="M 95 88 C 76 76 62 52 64 36 C 76 45 88 64 96 80 Z" />
  </g>

  <!-- Symmetrical Palm Fronds (Right Wing) -->
  <g id="palm-right" fill="url(#leafGrad)">
    <!-- Bottom leaflet -->
    <path d="M 108 135 C 125 142 148 138 158 125 C 150 120 130 120 112 128 Z" opacity="0.9"/>
    <!-- Middle-low leaflet -->
    <path d="M 110 120 C 132 122 155 110 162 92 C 150 90 130 98 112 112 Z" opacity="0.95"/>
    <!-- Middle-high leaflet -->
    <path d="M 108 104 C 132 100 152 80 154 60 C 142 64 124 76 111 96 Z" />
    <!-- Top-high leaflet -->
    <path d="M 105 88 C 124 76 138 52 136 36 C 124 45 112 64 104 80 Z" />
  </g>

  <!-- Central Stem / Droplet Tail -->
  <path d="M 98 140 C 98 154 100 165 100 168 C 100 165 102 154 102 140 Z" fill="#2dd4bf" opacity="0.8"/>

  <!-- Center Capsule Pill Shell (Upper Cap - Teal) -->
  <path d="M 87 88 L 87 64 C 87 56.8 92.8 51 100 51 C 107.2 51 113 56.8 113 64 L 113 88 Z" fill="url(#tealGrad)" />

  <!-- Center Capsule Pill Shell (Lower Body - Dark Navy / Bordered) -->
  <path d="M 87 90 L 87 114 C 87 121.2 92.8 127 100 127 C 107.2 127 113 121.2 113 114 L 113 90 Z" fill="#0f172a" stroke="#2dd4bf" stroke-width="2.5" />

  <!-- Capsule Separation Seam -->
  <line x1="87" y1="89" x2="113" y2="89" stroke="#facc15" stroke-width="2" />

  <!-- Clinical Medical Cross (Integrated on Capsule Center) -->
  <!-- Cross Shadow / Contrast Border -->
  <g filter="url(#softGlow)">
    <!-- Vertical bar -->
    <rect x="96" y="74" width="8" height="24" rx="2" fill="#0f172a" stroke="#0f172a" stroke-width="3"/>
    <!-- Horizontal bar -->
    <rect x="88" y="82" width="24" height="8" rx="2" fill="#0f172a" stroke="#0f172a" stroke-width="3"/>
    <!-- Vertical fill -->
    <rect x="96.5" y="74.5" width="7" height="23" rx="1.5" fill="url(#amberAccent)"/>
    <!-- Horizontal fill -->
    <rect x="88.5" y="82.5" width="23" height="7" rx="1.5" fill="url(#amberAccent)"/>
  </g>

  <!-- Sleek Capsule Glass Sheen Overlay -->
  <path d="M 91 58 C 91 54 94 53 97 53 C 94 55 93 60 93 72 L 91 72 Z" fill="#ffffff" opacity="0.5" />
</svg>
