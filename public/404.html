<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>District Drug Formulary — PKD Kuala Langat</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages SPA routing fallback
      const l = window.location;
      if (l.pathname.endsWith('/intro') || l.pathname.endsWith('/intro/')) {
        const basePath = l.pathname.replace(/\/intro\/?$/, '/');
        window.location.replace(l.protocol + '//' + l.host + basePath + 'intro');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
